  <!-- Applies the saved theme and language before first paint, so the page never
       flashes the wrong mode or direction. Keep the storage keys and defaults in
       sync with ThemeContext.jsx and LangContext.jsx. -->
  <script>
    (function () {
      var root = document.documentElement
      var theme = null
      var lang = null
      try {
        theme = localStorage.getItem('ezbac_theme')
        lang = localStorage.getItem('ezbac_lang')
      } catch (e) { /* storage unavailable: fall back to the defaults */ }

      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      if (theme === 'dark' || (theme !== 'light' && prefersDark)) root.classList.add('dark')
      if (lang === 'fr' || lang === 'ar') root.lang = lang
      if (lang === 'ar') root.dir = 'rtl'

      // The hero photo is the landing page's largest paint. Fetch it early there
      // without making every other route download it.
      if (location.pathname === '/') {
        var hero = document.createElement('link')
        hero.rel = 'preload'
        hero.as = 'image'
        hero.href = '/assets/images/landing/hero-student.webp'
        hero.setAttribute('fetchpriority', 'high')
        document.head.appendChild(hero)
      }
    })()
  </script>

  <!-- Critical styles: the themed page background and a branded boot screen, so
       the first paint is on-brand before the app's stylesheet and bundle load.
       The fade-in delay keeps it from flashing on fast connections. -->
  <style>
    html { background: #fff; color-scheme: light; }
    html.dark { background: #0F1116; color-scheme: dark; }
    body { margin: 0; }
    .boot {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      animation: boot-in 0.3s ease 0.25s both;
    }
    .boot img { height: 72px; width: auto; animation: boot-breathe 1.8s ease-in-out infinite; }
    .boot span { display: flex; gap: 5px; }
    .boot i { width: 6px; height: 6px; border-radius: 50%; background: #AB1017; animation: boot-dot 1.2s ease-in-out infinite; }
    .boot i:nth-child(2) { animation-delay: 150ms; }
    .boot i:nth-child(3) { animation-delay: 300ms; }
    @keyframes boot-in { from { opacity: 0; } }
    @keyframes boot-breathe { 50% { transform: scale(1.06); } }
    @keyframes boot-dot { 40% { transform: translateY(-4px); opacity: 1; } 0%, 80%, 100% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .boot img, .boot i { animation: none; } }
  </style>
  <noscript><style>.boot { display: none; }</style></noscript>
